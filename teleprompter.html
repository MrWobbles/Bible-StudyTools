<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('bst-theme') || 'dark';
        var allowedThemes = ['dark', 'light', 'monokai-dark', 'dracula-dark', 'nord-dark'];
        var normalizedTheme = allowedThemes.includes(theme) ? theme : 'dark';
        document.documentElement.setAttribute('data-theme', normalizedTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <title>Teleprompter — Bible Study</title>
  <link rel="icon" href="assets/images/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/teacher.css" />
</head>

<body class="page page--teleprompter">
  <div class="page app app--teleprompter">
    <!-- Control Bar (Top) -->
    <header class="teleprompter__header">
      <div class="teleprompter__controls">
        <!-- Speech Recognition Controls -->
        <button id="toggle-listening" class="btn-primary" title="Start/Stop listening (Space)">
          <span class="material-icons">mic</span>
          <span class="btn-label">Start Listening</span>
        </button>

        <!-- Scroll Navigation -->
        <button id="manual-next" class="btn-secondary" title="Next point (→)">
          <span class="material-icons">skip_next</span>
        </button>
        <button id="manual-prev" class="btn-secondary" title="Previous point (←)">
          <span class="material-icons">skip_previous</span>
        </button>
        <button id="reset-scroll" class="btn-secondary" title="Reset to top">
          <span class="material-icons">refresh</span>
        </button>

        <!-- Student display -->
        <button id="open-display" class="btn-secondary" title="Open student display window">
          <span class="material-icons">cast</span>
        </button>
        <button id="clear-display" class="btn-secondary" title="Clear student display (C)">
          <span class="material-icons">hide_image</span>
        </button>
        <button id="verse-prev" class="btn-secondary" title="Previous verse page (Up arrow)">
          <span class="material-icons">keyboard_arrow_up</span>
        </button>
        <button id="verse-next" class="btn-secondary" title="Next verse page (Down arrow)">
          <span class="material-icons">keyboard_arrow_down</span>
        </button>

        <!-- Speed Control -->
        <div class="teleprompter__speed-controls">
          <button id="play-pause-scroll" class="btn-primary" title="Play/Pause scrolling (Space)">
            <span class="material-icons">play_arrow</span>
            <span class="btn-label">Play</span>
          </button>
          <button id="speed-down" class="btn-secondary" title="Slow down (-, Shift for fine)" style="min-width: 40px;">
            <span class="material-icons">remove</span>
          </button>
          <input id="speed-input" type="number" min="5" max="300" step="1" value="60" title="Scroll speed (px/s)" style="width: 70px;" />
          <span id="speed-display" class="speed-text" title="Current scroll speed">60 px/s (100%)</span>
          <button id="speed-up" class="btn-secondary" title="Speed up (+, Shift for fine)" style="min-width: 40px;">
            <span class="material-icons">add</span>
          </button>
          <button id="speed-reset" class="btn-secondary" title="Reset speed (R)">
            <span class="material-icons">restore</span>
          </button>
        </div>
      </div>
      <div class="teleprompter__status">
        <span id="listening-status" class="status-indicator">Listening: OFF</span>
        <span id="current-confidence" class="confidence-display" style="display: none;"></span>
      </div>
      <div class="teleprompter__close">
        <button id="close-teleprompter" class="btn-icon" title="Close teleprompter">
          <span class="material-icons">close</span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
<div class="teleprompter__container" id="content-area">
      <div class="teleprompter__content" id="teleprompter-content">
        <div class="teleprompter__section-title" id="current-section-title">
          Loading...
        </div>

        <div class="teleprompter__script" id="script-flow"></div>
      </div>
    </div>

    <!-- Bottom Info -->
    <div class="teleprompter__footer">
      <span id="progress-display" class="progress-text"></span>
      <span id="speech-transcript" class="speech-text"></span>
    </div>

    <!-- Debug Panel (Optional) -->
    <div id="debug-panel" class="teleprompter__debug" style="display: none;">
      <div class="debug-title">Debug Info</div>
      <div id="debug-output" class="debug-output"></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/teleprompter.js"></script>
</body>

</html>
